[project]
name = "enterprise-agent"
version = "2.0.0"
description = "企业文档处理智能体 v2: LangChain Agent + DeepSeek + OCR/Correct/RAG/Plot Tools"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-deepseek>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends/Query/File/Form 等在参数默认值中调用是官方用法
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "db", "tools", "web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "db", "tools", "web"]
