services:
  postgres:
    image: postgres:16-alpine
    container_name: ocr-review-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ocr_review
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocr_review"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
