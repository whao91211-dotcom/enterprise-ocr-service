<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocMind · 企业文档工作台</title><link rel="stylesheet" href="/static/app.css"></head><body>
<aside id="sidebar" aria-label="历史对话"><div class="brand"><span class="brand-mark">D</span><strong>DocMind</strong><button id="hide-sidebar" class="icon" aria-label="收起侧栏">‹</button></div><button id="new-chat" class="new-chat">＋ 新建对话</button><input id="search" type="search" placeholder="搜索历史对话" aria-label="搜索历史对话"><nav id="sessions"></nav><button id="more-sessions" class="text-button" hidden>更多对话</button><div class="sidebar-bottom"><button id="preferences" class="text-button">◎ 已保存偏好</button><span>本机工作区</span></div></aside>
<main id="workspace"><header><button id="show-sidebar" class="icon" aria-label="展开侧栏">☰</button><div id="chat-title">新对话</div><span id="service-status">正在检查配置</span></header><div id="messages" role="log" aria-label="对话消息"></div><div id="notice" role="status"></div><footer><div id="attachment-chip" hidden></div><div class="composer"><textarea id="input" rows="2" maxlength="4000" placeholder="描述你的任务，或上传单据…" aria-label="输入消息"></textarea><div class="composer-actions"><button id="attach" class="icon" aria-label="上传图片">＋</button><span>Enter 发送 · Shift + Enter 换行</span><button id="send" class="send" aria-label="发送消息">↑</button></div></div><input id="file" type="file" accept=".png,.jpg,.jpeg,.webp,.bmp" hidden></footer></main>
<aside id="preview-panel" hidden aria-label="文件预览"><div class="preview-header"><strong id="preview-title">预览</strong><a id="download" class="text-button" hidden>下载原文件</a><button id="close-preview" class="icon" aria-label="关闭预览">×</button></div><div id="preview-content"></div></aside><script type="module" src="/static/app.js"></script></body></html>
