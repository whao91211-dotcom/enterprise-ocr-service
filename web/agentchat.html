<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocMind Agent · 企业文档智能处理</title>
<style>
 :root{
   --bg:#0b0e14; --panel:#12161f; --panel-2:#171c26; --line:#1f2633;
   --text:#e6ebf2; --muted:#8a96a8; --faint:#5c6774;
   --accent:#38bdf8; --ok:#3ecf8e; --warn:#e8a33d;
   --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
   --sans:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
 }
 *{box-sizing:border-box} html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column}
 header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;flex-shrink:0}
 .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
 .logo .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#06131c;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:14px}
 .head-meta{color:var(--muted);font-size:12px;font-family:var(--mono)}
 .head-status{margin-left:auto;color:var(--muted);font-size:12px;font-family:var(--mono)}
 .head-status b{color:var(--ok);font-weight:500}
 main{flex:1;display:flex;flex-direction:column;min-height:0}
 #messages{flex:1;overflow-y:auto;padding:24px 26px 8px}
 .msg{max-width:760px;margin:14px 0;font-size:14.5px;line-height:1.7}
 .msg.user{margin-left:auto}
 .msg .who{color:var(--faint);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
 .msg.user .who{color:var(--faint)}
 .msg.bot .who{color:var(--accent)}
 .msg.user .body{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 15px}
 .msg.bot pre,.msg.bot .trace{font-family:var(--mono);font-size:13px;color:var(--muted)}
 .trace{display:block;margin:3px 0}
 .trace .t-ag{color:var(--accent)} .trace .t-res{color:var(--ok)} .trace .t-err{color:var(--warn)}
 table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}
 th,td{border:1px solid var(--line);padding:7px 11px;text-align:left}
 th{background:var(--panel-2);color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:500}
 td{font-family:var(--mono)} td:first-child{font-family:var(--sans)}
 img{max-width:420px;border-radius:8px;margin-top:10px;border:1px solid var(--line)}
 .welcome{border-left:2px solid var(--accent);padding:4px 0 4px 18px;color:var(--muted);font-size:14px;line-height:1.9;max-width:720px}
 .welcome b{color:var(--text)}
 footer{border-top:1px solid var(--line);padding:16px 26px 22px;flex-shrink:0}
 .composer{display:flex;gap:10px;align-items:center}
 #q{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 16px;color:var(--text);font-size:14.5px}
 #q:focus{outline:none;border-color:var(--accent)}
 .btn{height:46px;padding:0 22px;border:none;border-radius:8px;background:var(--accent);color:#06131c;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
 .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--muted)}
 .btn:hover{filter:brightness(1.08)}
 #preview{max-height:90px;border-radius:8px;border:1px dashed var(--line);margin-bottom:10px;display:none}
 .hint{color:var(--faint);font-size:12.5px;margin-top:10px;font-family:var(--mono)}
 #file{display:none}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mark">DM</span> DocMind · Agent</div>
  <div class="head-meta">企业文档处理 · 智能中控</div>
  <div class="head-status"><b>●</b> InternVL · DeepSeek 在线</div>
</header>
<main>
  <div id="messages">
    <div class="welcome">
      <b>智能文档处理 Agent</b> — 上传销售单据图片自动识别；用一句话让它做检索、统计、画图。所有工具由 Agent 自主调用。<br>
      例：识别这张发票 · 有哪些商品 · 统计金额并画图 · 确认入库
    </div>
  </div>
</main>
<footer>
  <img id="preview" alt="preview">
  <div class="composer">
    <input id="q" placeholder="描述你的需求，或点 [上传] 附上一张单据图片" autocomplete="off">
    <button class="btn ghost" onclick="document.getElementById('file').click()">上传</button>
    <button class="btn" onclick="send()">发送</button>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" onchange="onPick(event)">
  </div>
  <div class="hint">// 识别后输入 确认 才计入统计 · 工具调用过程将实时展示</div>
</footer>
<script>
let history=[], pickedFile=null, busy=false;
function onPick(e){ const f=e.target.files[0]; if(!f)return; pickedFile=f; const p=document.getElementById('preview'); p.src=URL.createObjectURL(f); p.style.display='block'; }
function addMsg(who,text){ const d=document.createElement('div'); d.className='msg '+who;
 d.innerHTML='<div class="who">'+(who==='user'?'你':'Agent')+'</div><div class="body">'+text+'</div>';
 document.getElementById('messages').appendChild(d); scroll(); return d; }
function addTrace(text,cls){ const d=document.createElement('span'); d.className='trace '+(cls||'');
 d.innerHTML=text; document.getElementById('messages').appendChild(d); scroll(); return d; }
function scroll(){ const m=document.getElementById('messages'); m.scrollTop=m.scrollHeight; }
async function send(){
 if(busy)return; const q=document.getElementById('q').value.trim();
 if(!q&&!pickedFile)return;
 if(q) addMsg('user',esc(q)); if(pickedFile) addMsg('user','[已附图片] '+esc(pickedFile.name));
 const panel=addMsg('bot','…'); busy=true;
 try{
   let r;
   if(pickedFile){ const fd=new FormData(); fd.append('file',pickedFile); if(q)fd.append('message',q);
     r=await fetch('/api/agent/chat',{method:'POST',body:fd}); }
   else{ r=await fetch('/api/agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({message:q,history})}); }
   if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.detail||r.status); }
   const reader=r.body.getReader(), dec=new TextDecoder(); let acc='', ans='';
   while(true){ const {value,done}=await reader.read(); if(done)break;
     acc+=dec.decode(value,{stream:true}); const parts=acc.split('\n\n'); acc=parts.pop();
     for(const part of parts){ if(!part.startsWith('data: '))continue; const ev=JSON.parse(part.slice(6));
       if(ev.type==='intent'){ if(ev.intent&&ev.intent!=='chat') addTrace('→ intent: <span class="t-ag">'+esc(ev.intent)+'</span>'); }
       else if(ev.type==='tool_call'){ addTrace('→ tool: <span class="t-ag">'+esc(ev.name)+'</span>('+esc(JSON.stringify(ev.args).slice(0,55))+')'); }
       else if(ev.type==='tool_result'){ addTrace('&nbsp;&nbsp;↳ <span class="t-res">'+esc(String(ev.result).slice(0,110))+'</span>'); }
       else if(ev.type==='answer'){ ans=ev.answer; }
       else if(ev.type==='error'){ addTrace('⚠ <span class="t-err">'+esc(ev.message)+'</span>'); }
     } }
   renderAnswer(panel, ans);
   history.push({role:'user',content:q||'[uploaded]'}); history.push({role:'assistant',content:ans});
   history=history.slice(-20);
 }catch(e){ panel.querySelector('.body').textContent='⚠️ '+e.message; }
 finally{ busy=false; document.getElementById('q').value=''; pickedFile=null; document.getElementById('file').value=''; document.getElementById('preview').style.display='none'; }
 return false;
}
function renderAnswer(panel,text){ panel.querySelector('.body').innerHTML = text? mdToHtml(text) : '（无内容）'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mdToHtml(md){
  let h=esc(md);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?:^\|.+\|\s*\n\|[\s:|-]+\|\s*\n((?:\|.+\|\s*\n)*))/gm,function(mm){
    const ls=mm.trim().split('\n'); const head=ls[0].split('|').map(s=>s.trim()).filter(Boolean);
    const rows=ls.slice(2).map(l=>l.split('|').map(s=>s.trim()).filter(Boolean));
    let t='<table><thead><tr>'+head.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
    rows.forEach(r=>{t+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
    return t+'</tbody></table>';
  });
  h=h.replace(/\n+/g,'<br>');
  return h;
}
</script>
</body>
</html>
